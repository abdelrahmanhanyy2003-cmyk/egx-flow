# EGX Flow - local stack: TimescaleDB (PostgreSQL), Redis, backend API, frontend.
#   docker compose up --build
# Credentials come from ./.env (never baked into images).
# Every port is published on 127.0.0.1 only: nothing is reachable from other machines.

services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: egxflow
      POSTGRES_PASSWORD: egxflow
      POSTGRES_DB: egxflow
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U egxflow"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  backend:
    build: ./backend
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://egxflow:egxflow@db:5432/egxflow
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [backend]
    restart: unless-stopped

volumes:
  pgdata:
